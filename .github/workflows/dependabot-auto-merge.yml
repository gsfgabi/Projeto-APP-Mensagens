name: Dependabot auto-merge

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Metadados do Dependabot
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Habilitar auto-merge (patch, minor ou security)
        if: >
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor' ||
          contains(steps.meta.outputs.dependency-group, 'security')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          DEP_GROUP: ${{ steps.meta.outputs.dependency-group }}
        run: |
          set -euo pipefail
          echo "Fila de merge: type=${UPDATE_TYPE} group=${DEP_GROUP}"
          gh pr merge --auto --squash "$PR_URL"

      - name: Major fica para revisão
        if: >
          steps.meta.outputs.update-type == 'version-update:semver-major' &&
          !contains(steps.meta.outputs.dependency-group, 'security')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
        run: |
          gh pr comment "$PR_URL" --body "Bump **major** (${UPDATE_TYPE}). O CI não faz merge sozinho neste caso; alguém do time precisa revisar e mergear."
