name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app_unichat/functions/package-lock.json

      - name: Instalar Cloud Functions
        working-directory: app_unichat/functions
        run: npm ci

      - name: Lint Cloud Functions
        working-directory: app_unichat/functions
        run: npm run lint

      - name: Sintaxe do index.js
        working-directory: app_unichat/functions
        run: node --check index.js

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolver pacotes Flutter
        working-directory: app_unichat
        run: flutter pub get
