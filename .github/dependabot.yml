version: 2
updates:
  - package-ecosystem: npm
    directory: /app_unichat/functions
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      functions-version:
        applies-to: version-updates
        patterns:
          - "*"
      functions-security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: pub
    directory: /app_unichat
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      flutter-version:
        applies-to: version-updates
        patterns:
          - "*"
      flutter-security:
        applies-to: security-updates
        patterns:
          - "*"
